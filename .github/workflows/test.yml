name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every backend, even if one fails.
      fail-fast: false
      matrix:
        backend: [cpp, csharp, java, js, lua, py, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Temper's nightly build of main, with its own JRE. Asset names include
      # the version, so match by pattern.
      - name: Get Temper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dev -R temperlang/temper -p '*-linux-x64.tgz' -D "$RUNNER_TEMP/temper"
          mkdir -p "$RUNNER_TEMP/temper/install"
          tar -xzf "$RUNNER_TEMP"/temper/*-linux-x64.tgz -C "$RUNNER_TEMP/temper/install"
          bin=$(dirname "$(find "$RUNNER_TEMP/temper/install" -path '*/bin/temper' -type f | head -1)")
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/temper" version

      # Toolchains per backend. Runners already have g++, cargo and Maven.
      - if: matrix.backend == 'py'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: matrix.backend == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.backend == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.backend == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.backend == 'lua'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4
          command -v lua || sudo ln -s /usr/bin/lua5.4 /usr/local/bin/lua
          lua -v

      - name: Test
        run: temper test -b ${{ matrix.backend }}
