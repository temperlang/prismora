[project]
name = "prismora-tour"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["prismora"]

[tool.uv]
package = false

# The libraries `temper build` generates at the repo's top.
[tool.uv.sources]
prismora = { path = "../../../temper.out/py/prismora", editable = true }
temper-core = { path = "../../../temper.out/py/temper-core", editable = true }
temper-std = { path = "../../../temper.out/py/std", editable = true }
